# Exportação do kill-switch — sempre manual (é um evento de emergência,
# não uma rotina agendada). Publica no CDN isolado da API (ADR-0004,
# RF-039A): sem log de aplicação, sem identificador de usuário no caminho.
name: Exportar kill-switch

on:
  workflow_dispatch:
    inputs:
      motivo:
        description: "Motivo desta exportação (fica só no log deste run, nunca no arquivo publicado)"
        required: true
        type: string

concurrency:
  group: kill-switch-export
  cancel-in-progress: false

jobs:
  exportar:
    name: Exportar storylet_kill_switch → CDN
    runs-on: ubuntu-latest
    environment: kill-switch # gate humano — publicação afeta todos os usuários imediatamente
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Ler tabela administrativa e gerar JSON estático
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PRODUCAO }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PRODUCAO }}
        run: pnpm --filter @forja/tools-conteudo run exportar-kill-switch

      - name: Publicar no CDN (Cloudflare R2)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put forja-kill-switch/lista.json \
            --file ./kill-switch.json \
            --content-type application/json
