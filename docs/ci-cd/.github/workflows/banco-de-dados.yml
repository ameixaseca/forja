# Banco de dados — em PR, aplica todas as migrações do zero contra um
# Supabase local (dry-run real, com auth.users e RLS de verdade, não um
# Postgres genérico). Em merge, aplica em staging automaticamente e em
# produção atrás de aprovação humana (ADR-0015).
name: Banco de dados

on:
  pull_request:
    paths:
      - "database/migrations/**"
  push:
    branches: [main]
    paths:
      - "database/migrations/**"

concurrency:
  group: banco-de-dados-${{ github.ref }}
  cancel-in-progress: false # nunca cancelar uma migração em andamento

jobs:
  dry-run:
    name: Aplicar migrações num Supabase local
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Subir stack local do Supabase (inclui auth.users)
        run: supabase start
      - name: Aplicar todas as migrações do zero
        run: supabase db reset
      - name: Parar stack local
        if: always()
        run: supabase stop

  deploy-staging:
    name: Aplicar em staging (automático)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - name: Aplicar migrações pendentes em staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
        run: |
          supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF_STAGING }}
          supabase db push

  deploy-producao:
    name: Aplicar em produção (aprovação manual)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - name: Aplicar migrações pendentes em produção
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCAO }}
        run: |
          supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF_PRODUCAO }}
          supabase db push
