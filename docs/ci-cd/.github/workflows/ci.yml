# CI — lint, typecheck, testes unitários e build, escopados aos pacotes
# afetados pela mudança (ADR-0013). Roda em todo Pull Request e como
# checagem de sanidade após merge em main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  qualidade:
    name: ${{ matrix.tarefa }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "build" aqui é checagem de compilação/bundle (tsc, next build,
        # nest build, expo export), não o artefato de loja — isso é
        # responsabilidade de mobile-release.yml.
        tarefa: [lint, typecheck, test, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necessário para o turbo comparar contra origin/main

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Cache do Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ matrix.tarefa }}-${{ github.sha }}
          restore-keys: turbo-${{ matrix.tarefa }}-

      - name: Rodar ${{ matrix.tarefa }} nos pacotes afetados
        run: pnpm turbo run ${{ matrix.tarefa }} --filter=...[origin/main]
