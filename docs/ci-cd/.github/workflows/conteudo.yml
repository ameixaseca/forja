# Validação de conteúdo narrativo — só dispara quando o catálogo de
# campanha ou o motor narrativo mudam (D-032, RF-100–103). Sem portão de
# publicação além destas suítes (§14 do PRD): tratar como checagem
# obrigatória na proteção de branch sempre que estes caminhos forem tocados.
name: Validação de conteúdo

on:
  pull_request:
    paths:
      - "content/**"
      - "packages/motor-narrativo/**"
      - "tooling/verificador/**"
      - "tooling/simulador/**"
      - "docs/testes/cobertura.py"

concurrency:
  group: conteudo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar-catalogo:
    name: Lint de conteúdo (verificar.py + cobertura.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências do verificador
        run: pip install -r tooling/verificador/requirements.txt
      - name: Rodar verificar.py sobre o catálogo (SCH-xx e T-01 a T-21, ESPEC §7.2)
        run: python tooling/verificador/verificar.py content/campanhas/espinha/
      - name: Rodar testes do verificador (fixtures negativas, DEC-037)
        run: pytest tooling/verificador
      - name: Rodar cobertura.py (cobertura BDD dos requisitos)
        run: python docs/testes/cobertura.py

  motor-e-simulador:
    name: Suítes de motor e simulador de travessia (RF-035, RF-100–103)
    needs: verificar-catalogo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Testes de propriedade do motor narrativo (RF-036)
        run: pnpm turbo run test --filter=@forja/motor-narrativo

      - name: Simulador de travessia — mínimo de execuções exigido (M=50 por commit, ESPEC §7.1)
        run: >
          pnpm --filter tooling-simulador run simulate --
          --catalog ../../content/campanhas/espinha/manifest.json
          --runs 50
          --policy constante
          --output relatorio-simulacao.html

      - name: Publicar relatório do simulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-simulador-${{ github.event.pull_request.number }}
          path: tooling/simulador/relatorio-simulacao.html
